name: CI
on: [push, pull_request]

jobs:
  build-test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: flake8 src app tests
      - name: Unit tests
        run: pytest -v --junitxml=pytest-report.xml
      - name: Generate EDA figures
        run: python -m src.eda
      - name: Train model
        run: python -m src.train
      - name: Inference smoke test
        run: python -m src.predict --csv data/heart_clean.csv --out predictions.csv
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: |
            models/
            mlflow.db
            mlruns/
            predictions.csv
            screenshots/eda/
            pytest-report.xml

  docker:
    needs: build-test-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t heart-api:ci .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name api heart-api:ci
          sleep 8
          curl -f localhost:8000/health
          curl -f -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}'
          docker logs api
